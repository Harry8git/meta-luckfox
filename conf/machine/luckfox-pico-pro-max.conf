require conf/machine/include/luckfox-rv1106.inc
KERNEL_DEVICETREE = "rockchip/rv1106g-luckfox-pico-pro-max.dtb"
RK_KERNEL_DTS_BASE = "rv1106g-luckfox-pico-pro-max"

IMAGE_FSTYPES = "wic"
WKS_FILE = "luckfox-pico-pro-max-sd.wks.in"

do_image_wic[depends] += "u-boot-rockchip:do_deploy virtual/kernel:do_deploy"

# The wks layout above ends with the "rootfs" partition as the last GPT
# entry on the disk, with no --size given, so wic sizes it to fit only the
# files it contains. rootfs-resize grows that partition (and its
# filesystem) to fill whatever SD/eMMC it actually gets written to.
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "rootfs-resize"